<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10291f"><title>Chain Gang | Disc Golf & Putting</title>
<style>

input:focus{outline:2px solid #d2f17b}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.chip{padding:10px 12px;border:1px solid #425c57;border-radius:100px;background:#172932;color:#e6f5ec}.chip.on{background:#d2f17b;color:#17260d}.badge{background:#27483b;color:#b9e9ce;border-radius:60px;padding:5px 9px;font-size:11px;font-weight:750}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row+.row{border-top:1px solid #345344;padding-top:12px;margin-top:12px}.scoretable{width:100%;border-collapse:separate;border-spacing:0 5px;font-size:13px}.scoretable th{text-align:left;color:#9fb7b0;font-size:11px;padding:5px}.scoretable td{background:#1d382c;padding:7px 5px}.scoretable td:first-child{border-radius:8px 0 0 8px}.scoretable td:last-child{border-radius:0 8px 8px 0}.scoreinput{width:61px;max-width:100%;background:#0c241b;color:white;border:1px solid #42615d;border-radius:7px;padding:9px 4px;text-align:center}.scoreinput.match{width:74px}.scroll{overflow-x:auto}table.standings{width:100%;border-collapse:collapse;font-size:13px}.standings th{text-align:left;font-size:11px;color:#a0b5ae;font-weight:650}.standings td,.standings th{padding:11px 7px;border-bottom:1px solid #2e4146}.standings td:first-child{font-weight:750}.pos{font-weight:850;color:#d2f17b}.match{padding:13px 0;border-bottom:1px solid #345344}.match:last-child{border-bottom:0}.matchnames{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:13px;font-weight:650}.matchnames span:last-child{text-align:right}.matchinputs{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:8px}.matchinputs input{width:88px;background:#0b191f;color:#eef7ef;border:1px solid #46605c;border-radius:9px;padding:9px;text-align:center}.matchinputs b{color:#869d96;font-size:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#12271f;border-top:1px solid #344a48;display:flex;justify-content:center;z-index:2;padding:8px 8px max(8px,env(safe-area-inset-bottom))}.nav{max-width:780px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{color:#92a9a2;background:transparent;border:0;padding:6px 3px;font-size:10px}.nav button span{display:block;font-size:22px;margin-bottom:2px}.nav button.current{color:#d2f17b}.statbar{display:flex;gap:6px;flex-wrap:wrap}.stat{background:#1d3433;padding:8px 11px;border-radius:10px;font-size:12px}.empty{text-align:center;color:#a8bcb2;padding:35px 10px}.note{background:#25352b;border-left:3px solid #d2f17b;border-radius:7px;padding:11px;font-size:12px;color:#c9e4d4;margin:12px 0}.inline{display:flex;align-items:center;gap:8px}.inline>*{flex:1}.divider{border:0;border-top:1px solid #345344;margin:16px 0}.linkbtn{background:transparent;border:0;color:#b8ec9f;padding:7px 0;text-align:left}.mini{padding:8px 10px;font-size:12px}.pill{padding:5px 8px;border-radius:8px;background:#2b403e;color:#d4f1e1;font-size:12px}.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;border:1px solid #38544e;background:#15262b;color:#aec7bc;border-radius:8px;padding:10px;font-size:12px}.tabs button.active{background:#d2f17b;color:#10200e}.warning{color:#ffd1aa;font-size:12px} @media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}.container{padding:22px}.top{padding:28px 24px}}
.top{position:relative;overflow:hidden;border-bottom:1px solid #3a6544}.top::after{content:'🥏';position:absolute;right:19px;top:23px;font-size:60px;opacity:.15;transform:rotate(-22deg);pointer-events:none}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#235f39,#1a402e 73%);border-color:#578c50}.hero::after{content:'🥏';position:absolute;right:-12px;bottom:-31px;font-size:135px;opacity:.16;transform:rotate(-26deg);pointer-events:none}.hero h2,.hero p,.hero button{position:relative;z-index:1}.finish-banner{text-align:center;background:linear-gradient(145deg,#214d31,#19382b);border-color:#679651;padding:22px}.finish-banner h2{margin:6px 0 12px}.finish-disc{font-size:64px;margin-bottom:7px}.next-choices{display:grid;gap:11px;margin:18px 0 28px}.next-choices button{min-height:60px;text-align:left;padding:14px 17px;font-size:15px}.next-choices button span{display:block;margin-top:5px;font-weight:450;font-size:11px;opacity:.8}.tile{transition:transform .15s ease}.tile:active{transform:scale(.97)}
</style></head><body><div id="app" class="app"></div><script>
'use strict';
const K='clubhouse-golf-v1';const uid=()=>Math.random().toString(36).slice(2,10);const today=()=>new Date().toLocaleDateString('en-CA');
let data;try{data=JSON.parse(localStorage.getItem(K))}catch{};data=data||{players:[],rounds:[],puttings:[],draftRound:null,draftPutting:null};
let page='home',roundHole=0,puttingDay=0,lbTab='putting',selectedIds=[],puttingSource='round',nextRoundHoles=3; if(data.postRoundId&&data.rounds.some(r=>r.id===data.postRoundId))page='round-done';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const player=id=>data.players.find(p=>p.id===id);const name=id=>player(id)?.name||'Unknown';const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
function save(){localStorage.setItem(K,JSON.stringify(data))}function go(p){page=p;window.scrollTo(0,0);render()}function addPlayer(v){const n=v.trim();if(!n)return null;let p=data.players.find(p=>p.name.toLowerCase()===n.toLowerCase());if(!p){p={id:uid(),name:n};data.players.push(p);save()}return p.id}
const head=(t,s='')=>`<div class="top"><div class="eyebrow">🥏 Chain Gang / Disc Golf</div><h1>${esc(t)}</h1>${s?`<p>${esc(s)}</p>`:''}</div>`;
const nav=()=>`<div class="bottom"><div class="nav">${[['home','⌂','Home'],['round','🥏','Round'],['putting','◎','Putting'],['leaderboards','▥','Rankings']].map(([id,icon,t])=>`<button class="${page===id?'current':''}" onclick="go('${id}')"><span>${icon}</span>${t}</button>`).join('')}</div></div>`;
const empty=t=>`<div class="empty">${t}</div>`;
function render(){let content=page==='home'?home():page==='round'?roundPage():page==='putting'?puttingPage():page==='leaderboards'?leaderboards():page==='round-done'?roundDonePage():playersPage();$('#app').innerHTML=content+nav()}
function home(){return head('Chain Gang','Disc golf rounds, putting battles, and bragging rights.')+`<main class="container"><div class="hero"><div class="eyebrow">Ready to play?</div><h2>Every stroke counts.<br>Every match matters.</h2><p>Track your disc golf round, seed a putting tournament, and keep the all-time records.</p><button class="primary" onclick="go('round')">Start a round →</button></div><div class="grid"><button class="tile" onclick="go('round')"><div class="emoji">🥏</div><b>Start Round</b><span>Hole-by-hole scores</span></button><button class="tile" onclick="go('putting')"><div class="emoji">🎯</div><b>Start Putting</b><span>Round robin matchups</span></button><button class="tile" onclick="go('leaderboards')"><div class="emoji">🏆</div><b>Leaderboards</b><span>Records & history</span></button><button class="tile" onclick="go('players')"><div class="emoji">👥</div><b>Players</b><span>Manage the roster</span></button></div><div class="card" style="margin-top:16px"><h3>Club stats</h3><div class="statbar"><span class="stat">${data.players.length} players</span><span class="stat">${data.rounds.length} saved disc golf rounds</span><span class="stat">${data.puttings.length} putting tournaments</span></div></div>${data.draftRound||data.draftPutting?`<div class="note">You have an unfinished ${data.draftRound?'disc golf round':''}${data.draftRound&&data.draftPutting?' and ':''}${data.draftPutting?'putting tournament':''}. Open that section to continue.</div>`:''}</main>`}
function rosterSelector(){return `<label class="field">Number of participants<input id="participantCount" type="number" min="2" max="32" value="${selectedIds.length||2}" onchange="checkPlayerCount()"></label><h3>Choose players</h3><div class="chips">${data.players.map(p=>`<button class="chip ${selectedIds.includes(p.id)?'on':''}" onclick="togglePlayer('${p.id}')">${esc(p.name)} ${selectedIds.includes(p.id)?'✓':'+'}</button>`).join('')||'<span class="muted small">No saved players yet. Add one below.</span>'}</div><div class="inline"><label class="field" style="margin:6px 0"><input id="newPlayer" placeholder="New player name" onkeydown="if(event.key==='Enter')addFromField()"></label><button class="secondary" style="flex:0 0 auto" onclick="addFromField()">+ Add</button></div><div class="muted small" id="playerSelectionCount">${selectedIds.length} selected</div>`}
function checkPlayerCount(){const n=+$('#participantCount').value;$('#playerSelectionCount').textContent=`${selectedIds.length} selected of ${n} needed`}
function togglePlayer(id){selectedIds=selectedIds.includes(id)?selectedIds.filter(x=>x!==id):[...selectedIds,id];render()}
function addFromField(){let n=$('#newPlayer')?.value;let id=addPlayer(n||'');if(id&&!selectedIds.includes(id))selectedIds.push(id);render()}
function roundPage(){const r=data.draftRound;if(!r)return head('Disc golf round','Choose any hole count and set your card.')+`<main class="container"><div class="card"><label class="field">Total holes<input id="holes" type="number" inputmode="numeric" min="1" max="72" step="1" value="${nextRoundHoles}" required><span class="muted small">Enter any number from 1 to 72, including short 3-hole rounds.</span></label><label class="field">Round date<input id="rDate" type="date" value="${today()}"></label>${rosterSelector()}<div class="actions"><button class="primary wide" onclick="startRound()">Start scoring →</button></div><p class="muted small">Low total score wins. Ties share the same placement; every completed round is saved in history.</p></div></main>`;
roundHole=Math.min(roundHole,r.holes-1);let totals=r.ids.map(id=>({id,total:r.scores[id].reduce((a,b)=>a+(Number(b)||0),0),filled:r.scores[id].filter(v=>v!==null&&v!=='').length})).sort((a,b)=>a.total-b.total);
return head(`Round • Hole ${roundHole+1}`,`${r.holes} holes · ${r.ids.length} players · ${fmt(r.date)}`)+`<main class="container"><div class="card"><div class="row"><b>Hole ${roundHole+1} of ${r.holes}</b><span class="badge">${Math.round(100*(r.ids.reduce((a,id)=>a+r.scores[id].filter(x=>x!==null&&x!=='').length,0))/(r.holes*r.ids.length))}% entered</span></div><div class="actions"><button class="secondary" onclick="changeHole(-1)" ${roundHole===0?'disabled':''}>← Previous</button><button class="secondary" onclick="changeHole(1)" ${roundHole===r.holes-1?'disabled':''}>Next hole →</button></div><table class="scoretable"><thead><tr><th>Player</th><th>Strokes</th><th>Total</th></tr></thead><tbody>${r.ids.map(id=>`<tr><td>${esc(name(id))}</td><td><input class="scoreinput" type="number" inputmode="numeric" min="1" max="30" placeholder="–" value="${r.scores[id][roundHole]??''}" onchange="setStroke('${id}',${roundHole},this.value)"></td><td>${r.scores[id].reduce((a,b)=>a+(Number(b)||0),0)}</td></tr>`).join('')}</tbody></table><div class="chips">${Array.from({length:r.holes},(_,i)=>`<button class="chip mini ${roundHole===i?'on':''}" onclick="roundHole=${i};render()">${i+1}</button>`).join('')}</div></div><div class="card"><h3>Live round leaderboard</h3><table class="standings"><tr><th>#</th><th>Player</th><th>Strokes</th><th>Holes scored</th></tr>${totals.map((x,i)=>`<tr><td class="pos">${i+1}</td><td>${esc(name(x.id))}</td><td>${x.total}</td><td>${x.filled}/${r.holes}</td></tr>`).join('')}</table><p class="muted small">Live totals may reflect different numbers of completed holes.</p></div><div class="actions"><button class="primary" onclick="finishRound()">Finish & save round</button><button class="danger" onclick="cancelRound()">Discard</button></div></main>`}
function startRound(){let n=+$('#participantCount').value,h=Number($('#holes').value);if(!Number.isInteger(h)||h<1||h>72)return alert('Enter a whole number of holes from 1 to 72.');if(!Number.isInteger(n)||n<2||n>32||selectedIds.length!==n)return alert(`Please select exactly ${n} players (2–32).`);data.draftRound={id:uid(),date:$('#rDate').value||today(),holes:h,ids:[...selectedIds],scores:Object.fromEntries(selectedIds.map(id=>[id,Array(h).fill(null)]))};roundHole=0;save();render()}
function setStroke(id,i,v){if(v!==''&&(!Number.isInteger(+v)||+v<1||+v>30))return alert('Enter a whole number of strokes from 1 to 30.');data.draftRound.scores[id][i]=v===''?null:+v;save();render()}
function changeHole(n){roundHole=Math.min(Math.max(0,roundHole+n),data.draftRound.holes-1);render()}
function cancelRound(){if(confirm('Discard this unfinished round?')){data.draftRound=null;save();render()}}
function roundRanks(r){let arr=r.ids.map(id=>({id,score:r.scores[id].reduce((a,b)=>a+Number(b),0)})).sort((a,b)=>a.score-b.score||name(a.id).localeCompare(name(b.id)));return arr.map((x,i)=>({...x,rank:1+arr.filter(a=>a.score<x.score).length}))}
function finishRound(){const r=data.draftRound;let missing=r.ids.some(id=>r.scores[id].some(v=>v===null||v===''));if(missing&&!confirm('Some holes are missing scores. Save this incomplete round anyway?'))return;let complete=!missing;data.rounds.unshift({...r,complete});data.draftRound=null;data.postRoundId=r.id;nextRoundHoles=r.holes;save();selectedIds=[...r.ids];go('round-done')}
function roundDonePage(){const r=data.rounds.find(r=>r.id===data.postRoundId)||data.rounds[0];if(!r)return head('Round complete')+`<main class="container"><button class="primary" onclick="go('home')">Return home</button></main>`;const ranks=roundRanks(r);return head('Round in the books!','Disc golf · '+r.holes+' holes · '+fmt(r.date))+`<main class="container"><div class="card finish-banner"><div class="finish-disc">🥏</div><div class="eyebrow">${r.complete?'Saved round':'Saved incomplete round'}</div><h2>${ranks.length?esc(name(ranks[0].id))+' takes the top spot!':'Scores saved'}</h2><p class="muted small">Your scorecard is saved in the disc golf history. What's next?</p></div><div class="card"><h3>Final scorecard</h3><table class="standings"><tr><th>Place</th><th>Player</th><th>Strokes</th></tr>${ranks.map(x=>`<tr><td class="pos">${x.rank}</td><td>${esc(name(x.id))}</td><td>${x.score}</td></tr>`).join('')}</table></div><div class="next-choices"><button class="primary wide" onclick="afterRound('putting')">🎯 Start putting tournament <span>Seed players by this round's results</span></button><button class="secondary wide" onclick="afterRound('round')">🥏 Play another disc golf round <span>Use the same players, or change the card</span></button><button class="ghost wide" onclick="afterRound('home')">⌂ Return to home</button></div></main>`}
function afterRound(action){const r=data.rounds.find(r=>r.id===data.postRoundId);if(r){selectedIds=[...r.ids];nextRoundHoles=r.holes}data.postRoundId=null;save();if(action==='putting'){puttingSource='round';go('putting')}else if(action==='round'){roundHole=0;go('round')}else go('home')}
function puttingPage(){let t=data.draftPutting;if(!t)return puttingSetup();let matches=t.matches;let totalDays=Math.max(...matches.map(m=>m.day),0)+1;puttingDay=Math.min(puttingDay,totalDays-1);let thisDay=matches.filter(m=>m.day===puttingDay);let standings=puttingStats(t);
return head('Putting tournament',`${t.ids.length} players · ${fmt(t.date)} · ${matches.filter(m=>m.aScore!==null&&m.bScore!==null).length}/${matches.length} matches entered`)+`<main class="container"><div class="card"><div class="row"><h3 style="margin:0">Round robin • Set ${puttingDay+1} of ${totalDays}</h3><span class="badge">${t.seedType==='round'?'Round seeded':t.seedType==='leaderboard'?'Leaderboard seeded':'Custom'}</span></div><div class="chips">${Array.from({length:totalDays},(_,i)=>`<button class="chip mini ${i===puttingDay?'on':''}" onclick="puttingDay=${i};render()">Set ${i+1}</button>`).join('')}</div>${thisDay.map(m=>`<div class="match"><div class="matchnames"><span>${esc(name(m.a))}</span><span class="muted">VS</span><span>${esc(name(m.b))}</span></div><div class="matchinputs"><input type="number" inputmode="numeric" min="0" max="999" placeholder="Points" value="${m.aScore??''}" aria-label="Score for ${esc(name(m.a))}" onchange="setMatch('${m.id}','a',this.value)"><b>—</b><input type="number" inputmode="numeric" min="0" max="999" placeholder="Points" value="${m.bScore??''}" aria-label="Score for ${esc(name(m.b))}" onchange="setMatch('${m.id}','b',this.value)"></div></div>`).join('')||empty('Bye for all players')}</div><div class="card"><h3>Live tournament standings</h3>${standTable(standings)}<p class="muted small">Ranked by wins, then points differential, then points scored. Ties count as draws.</p></div><div class="actions"><button class="primary" onclick="finishPutting()">Finish & save tournament</button><button class="danger" onclick="cancelPutting()">Discard</button></div></main>`}
function puttingSetup(){let sourceOptions=data.rounds.length?`<option value="round">Latest saved disc golf round</option>`:'';return head('Start putting','Round robin competition with points and tiebreakers.')+`<main class="container"><div class="card"><label class="field">Seed player order from<select id="putSeed" onchange="setPuttingSeed(this.value)">${sourceOptions}<option value="leaderboard">All-time putting leaderboard</option><option value="custom">Choose players manually</option></select></label><p id="seedNote" class="note"></p><label class="field">Tournament date<input id="putDate" type="date" value="${today()}"></label><div id="puttingRoster"></div><div class="actions"><button class="primary wide" onclick="startPutting()">Generate round robin →</button></div></div><div class="card"><h3>How the round robin works</h3><p class="muted small">Every selected player plays every other selected player once. Enter both scores in every match. A win earns 1 win, a loss 1 loss, and equal scores count as a draw. Tiebreakers use point differential (for − against), followed by points scored.</p></div></main>`}
function allTime(){let agg=Object.fromEntries(data.players.map(p=>[p.id,{id:p.id,w:0,l:0,d:0,pf:0,pa:0,g:0}]));for(let t of data.puttings)for(let m of t.matches){if(m.aScore===null||m.bScore===null)continue;for(let [id,own,opp] of [[m.a,m.aScore,m.bScore],[m.b,m.bScore,m.aScore]]){if(!agg[id])continue;let x=agg[id];x.pf+=own;x.pa+=opp;x.g++;if(own>opp)x.w++;else if(own<opp)x.l++;else x.d++}}return sortStats(Object.values(agg))}
function seedIds(){let mode=$('#putSeed')?.value||puttingSource;if(mode==='round'){let r=data.rounds[0];return r?roundRanks(r).map(x=>x.id):[]}if(mode==='leaderboard')return allTime().filter(x=>x.g>0).map(x=>x.id).concat(data.players.filter(p=>!data.puttings.some(t=>t.ids.includes(p.id))).map(p=>p.id));return selectedIds}
function setPuttingSeed(v){puttingSource=v;refreshPuttingRoster()}
function refreshPuttingRoster(){let box=$('#puttingRoster'),note=$('#seedNote');if(!box)return;let mode=$('#putSeed').value;let ids=seedIds();if(mode==='round'){let r=data.rounds[0];note.textContent=`Seeded from ${fmt(r.date)} disc golf round. Lowest stroke totals get the top seeds${r.complete?'':'. (Round was incomplete)'}.`;box.innerHTML=`<h3>Seed order</h3>${ids.map((id,i)=>`<div class="row"><span>${i+1}. ${esc(name(id))}</span></div>`).join('')}`}
else if(mode==='leaderboard'){note.textContent='Seeded by historical putting wins, point differential, and points scored. Unranked players are included at the bottom.';box.innerHTML=`<h3>Seed order</h3>${ids.map((id,i)=>`<div class="row"><span>${i+1}. ${esc(name(id))}</span></div>`).join('')||empty('Add players first')}`}
else {note.textContent='Manually select participants from your saved player list or add new people.';box.innerHTML=rosterSelector()}}
function makeMatches(ids){let list=[...ids];if(list.length%2)list.push(null);let n=list.length,days=n-1,arr=[];for(let day=0;day<days;day++){for(let i=0;i<n/2;i++){let a=list[i],b=list[n-1-i];if(a&&b)arr.push({id:uid(),day,a,b,aScore:null,bScore:null})}list=[list[0],list[n-1],...list.slice(1,n-1)]}return arr}
function startPutting(){let mode=$('#putSeed').value;let ids=seedIds();if(mode==='custom'){let n=+$('#participantCount').value;if(ids.length!==n)return alert(`Select exactly ${n} players.`)}ids=[...new Set(ids)];if(ids.length<2)return alert('Select at least 2 players.');data.draftPutting={id:uid(),date:$('#putDate').value||today(),ids,seedType:mode,matches:makeMatches(ids)};puttingDay=0;save();render()}
function setMatch(id,side,v){if(v!==''&&(!Number.isInteger(+v)||+v<0||+v>999))return alert('Enter a whole-number score from 0 to 999.');let m=data.draftPutting.matches.find(x=>x.id===id);m[side+'Score']=v===''?null:+v;save();render()}
function cancelPutting(){if(confirm('Discard this unfinished putting tournament?')){data.draftPutting=null;save();render()}}
function finishPutting(){let t=data.draftPutting;if(t.matches.some(m=>m.aScore===null||m.bScore===null)&&!confirm('Some matches have no final scores. Save anyway?'))return;data.puttings.unshift({...t,complete:t.matches.every(m=>m.aScore!==null&&m.bScore!==null)});data.draftPutting=null;save();alert('Tournament saved to historical leaderboards!');go('leaderboards')}
function sortStats(arr){return arr.sort((a,b)=>b.w-a.w||((b.pf-b.pa)-(a.pf-a.pa))||b.pf-a.pf||name(a.id).localeCompare(name(b.id)))}
function puttingStats(t){let stats=t.ids.map(id=>({id,w:0,l:0,d:0,pf:0,pa:0,g:0}));for(let m of t.matches){if(m.aScore===null||m.bScore===null)continue;for(let [id,own,against] of [[m.a,m.aScore,m.bScore],[m.b,m.bScore,m.aScore]]){let x=stats.find(v=>v.id===id);x.g++;x.pf+=own;x.pa+=against;if(own>against)x.w++;else if(own<against)x.l++;else x.d++}}return sortStats(stats)}
function standTable(arr){return `<div class="scroll"><table class="standings"><tr><th>#</th><th>Player</th><th>W</th><th>L</th><th>D</th><th>PF</th><th>PA</th><th>Diff</th></tr>${arr.map((x,i)=>`<tr><td class="pos">${i+1}</td><td>${esc(name(x.id))}</td><td>${x.w}</td><td>${x.l}</td><td>${x.d}</td><td>${x.pf}</td><td>${x.pa}</td><td>${x.pf-x.pa>0?'+':''}${x.pf-x.pa}</td></tr>`).join('')}</table></div>`}
function leaderboards(){return head('Leaderboards','Lifetime records and past event results.')+`<main class="container"><div class="tabs"><button class="${lbTab==='putting'?'active':''}" onclick="lbTab='putting';render()">Putting standings</button><button class="${lbTab==='rounds'?'active':''}" onclick="lbTab='rounds';render()">Golf rounds</button><button class="${lbTab==='history'?'active':''}" onclick="lbTab='history';render()">Putting history</button></div>${lbTab==='putting'?`<div class="card"><h3>All-time putting records</h3>${data.players.length?standTable(allTime()):empty('No players yet')}${data.puttings.length===0?'<p class="muted small">Complete a putting tournament to start recording wins, losses, and points.</p>':''}</div>`:lbTab==='rounds'?data.rounds.map(r=>`<div class="card"><div class="row"><h3>${fmt(r.date)}</h3><span class="badge">${r.holes} holes${r.complete?'':' · Incomplete'}</span></div><table class="standings"><tr><th>Place</th><th>Player</th><th>Total strokes</th></tr>${roundRanks(r).map(x=>`<tr><td class="pos">${x.rank}</td><td>${esc(name(x.id))}</td><td>${x.score}</td></tr>`).join('')}</table><button class="linkbtn" onclick="useRoundSeed('${r.id}')">Start putting from this round →</button></div>`).join('')||empty('No saved disc golf rounds yet'):data.puttings.map(t=>`<div class="card"><div class="row"><h3>${fmt(t.date)}</h3><span class="badge">${t.ids.length} players${t.complete?'':' · Incomplete'}</span></div>${standTable(puttingStats(t))}<details style="margin-top:12px"><summary class="muted small">View individual match results</summary>${t.matches.map(m=>`<p class="small">${esc(name(m.a))} ${m.aScore??'–'} — ${m.bScore??'–'} ${esc(name(m.b))}</p>`).join('')}</details></div>`).join('')||empty('No saved putting tournaments yet')}</main>`}
function useRoundSeed(id){let idx=data.rounds.findIndex(r=>r.id===id);if(idx>0){let [r]=data.rounds.splice(idx,1);data.rounds.unshift(r);save()}puttingSource='round';go('putting')}
function playersPage(){return head('Players','Your permanent player roster.')+`<main class="container"><div class="card"><h3>Add player</h3><div class="inline"><label class="field" style="margin:0"><input id="singlePlayer" placeholder="Player name" onkeydown="if(event.key==='Enter')newSinglePlayer()"></label><button class="primary" style="flex:0 0 auto" onclick="newSinglePlayer()">Add</button></div></div><div class="card"><h3>All players (${data.players.length})</h3>${data.players.map(p=>`<div class="row"><b>${esc(p.name)}</b><button class="ghost mini" onclick="renamePlayer('${p.id}')">Rename</button></div>`).join('')||empty('No players added yet')}</div><div class="note">Players are shared across all rounds and tournaments. Rename a player here and past results will reflect their updated name.</div><div class="card"><h3>Backup your data</h3><p class="muted small">This version stores your records on this device in this browser only. Export a backup before clearing your browsing data or changing phones.</p><div class="actions"><button class="secondary" onclick="exportData()">Export backup</button><button class="secondary" onclick="$('#importFile').click()">Import backup</button><input id="importFile" type="file" accept=".json,application/json" hidden onchange="importData(this)"></div></div></main>`}
function newSinglePlayer(){let n=$('#singlePlayer').value,id=addPlayer(n);if(!id)return alert('Enter a player name.');render()}
function renamePlayer(id){let p=player(id),n=prompt('New player name',p.name);if(!n?.trim())return;if(data.players.some(x=>x.id!==id&&x.name.toLowerCase()===n.trim().toLowerCase()))return alert('That name already exists.');p.name=n.trim();save();render()}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='chain-gang-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function importData(el){let file=el.files?.[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.players)||!Array.isArray(obj.rounds)||!Array.isArray(obj.puttings))throw Error('Invalid disc golf backup');if(!confirm('Import backup and replace existing data on this device?'))return;data={players:obj.players,rounds:obj.rounds,puttings:obj.puttings,draftRound:obj.draftRound||null,draftPutting:obj.draftPutting||null};save();render()}catch(e){alert('Could not import: '+e.message)}}
window.addEventListener('beforeunload',save);render();if(page==='putting'&&!data.draftPutting)refreshPuttingRoster();
const originalRender=render;render=function(){originalRender();if(page==='putting'&&!data.draftPutting){let el=$('#putSeed');if(el){if(puttingSource==='round'&&!data.rounds.length)puttingSource='leaderboard';el.value=puttingSource;refreshPuttingRoster()}}};render();
</script></body></html>
