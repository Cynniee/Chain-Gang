'use strict';
const APP_VERSION='1.0.5';
const K='clubhouse-golf-v1';const uid=()=>Math.random().toString(36).slice(2,10);const today=()=>new Date().toLocaleDateString('en-CA');
let data;try{data=JSON.parse(localStorage.getItem(K))}catch{};data=data||{players:[],rounds:[],puttings:[],draftRound:null,draftPutting:null};
// Preload the core roster for new and existing installs, without changing recorded results.
const starterPlayers=['Jimbo','RobKnob','Josh','Kegan'];
if(!Array.isArray(data.players))data.players=[];
if(!Array.isArray(data.removedDefaultNames))data.removedDefaultNames=[];
let addedStarter=false;
for(const playerName of starterPlayers){
  if(!data.removedDefaultNames.some(n=>n.toLowerCase()===playerName.toLowerCase())&&!data.players.some(p=>String(p.name).toLowerCase()===playerName.toLowerCase())){
    data.players.push({id:uid(),name:playerName});addedStarter=true;
  }
}
if(addedStarter)localStorage.setItem(K,JSON.stringify(data));
let page='home',roundHole=0,puttingDay=0,lbTab='putting',selectedIds=[],puttingSource='round',nextRoundHoles=3,roundMode='singles',puttingMode='singles',puttingTeamIds=null,teamSelected=null,teamDrag=null,suppressTeamClick=false; if(data.postRoundId&&data.rounds.some(r=>r.id===data.postRoundId))page='round-done';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function describeReroll(results,lockedIndex=null){

  return {reroll:results.map((_,i)=>i).filter(i=>i!==lockedIndex),lockedIndex,text:`${name(flipState.ids[lockedIndex])} is parked. Only the other ${n-1} discs flip again.`};
 }
 if(!topIdx.length || !bottomIdx.length){
  return {reroll:results.map((_,i)=>i),lockedIndex:null,text:'All discs matched. Full re-flip!'};
 }

 },2200);

function roundPage(){const r=data.draftRound;if(!r)return head('Disc golf round','Choose your format, hole count, and players.')+`<main class="container"><div class="card">${modePicker('round')}<label class="field">Total holes<input id="holes" type="number" inputmode="numeric" min="1" max="72" step="1" value="${nextRoundHoles}" required><span class="muted small">Any number from 1 to 72, including short 3-hole rounds.</span></label><label class="field">Round date<input id="rDate" type="date" value="${today()}"></label>${rosterSelector('round')}<div class="actions"><button class="primary wide" onclick="startRound()">Start scoring →</button></div><p class="muted small">${roundMode==='doubles'?'Each two-person team shares one score per hole. Low total team strokes wins.':'Low total score wins.'} Results are saved by date.</p></div></main>`;
roundHole=Math.min(roundHole,r.holes-1);let units=eventUnits(r);let totals=units.map(id=>({id,total:r.scores[id].reduce((a,b)=>a+(Number(b)||0),0),filled:r.scores[id].filter(v=>v!==null&&v!=='').length})).sort((a,b)=>a.total-b.total);
return head(`Round • Hole ${roundHole+1}`,`${r.holes} holes · ${r.ids.length} players · ${isDoubles(r)?'Doubles':'Singles'} · ${fmt(r.date)}`)+`<main class="container"><div class="card"><div class="row"><b>Hole ${roundHole+1} of ${r.holes}</b><span class="badge">${Math.round(100*(units.reduce((a,id)=>a+r.scores[id].filter(x=>x!==null&&x!=='').length,0))/(r.holes*units.length))}% entered</span></div><div class="actions"><button class="secondary" onclick="changeHole(-1)" ${roundHole===0?'disabled':''}>← Previous</button><button class="secondary" onclick="changeHole(1)" ${roundHole===r.holes-1?'disabled':''}>Next hole →</button></div><div class="par-control"><label for="holeParInput">🥏 Hole ${roundHole+1} par</label><input id="holeParInput" type="number" inputmode="numeric" min="2" max="10" step="1" value="${holePar(r,roundHole)??''}" onchange="setHolePar(${roundHole},this.value)" aria-label="Par for hole ${roundHole+1}"><span class="par-hint">Set the hole par (2–10). Defaults to 3 on new rounds. Each score is compared with this par.</span></div><table class="scoretable"><thead><tr><th>${isDoubles(r)?'Team':'Player'}</th><th>Strokes</th><th>Result</th><th>Total</th></tr></thead><tbody>${units.map(id=>`<tr><td>${esc(labelUnit(r,id))}</td><td><input class="scoreinput" type="number" inputmode="numeric" min="1" max="30" placeholder="–" value="${r.scores[id][roundHole]??''}" onchange="setStroke('${id}',${roundHole},this.value)"></td><td class="score-relative">${holeLabel(r.scores[id][roundHole],holePar(r,roundHole))}</td><td>${r.scores[id].reduce((a,b)=>a+(Number(b)||0),0)}</td></tr>`).join('')}</tbody></table><div class="chips">${Array.from({length:r.holes},(_,i)=>`<button class="chip mini ${roundHole===i?'on':''}" onclick="roundHole=${i};render()">${i+1}</button>`).join('')}</div></div><div class="card"><h3>Live round leaderboard</h3><table class="standings"><tr><th>#</th><th>${isDoubles(r)?'Team':'Player'}</th><th>Strokes</th><th>vs Par</th><th>Holes scored</th></tr>${totals.map((x,i)=>`<tr><td class="pos">${i+1}</td><td>${esc(labelUnit(r,x.id))}</td><td>${x.total}</td><td>${relativeScore(r,x.id)}</td><td>${x.filled}/${r.holes}</td></tr>`).join('')}</table><p class="muted small">Live totals may reflect different numbers of completed holes.</p></div><div class="actions"><button class="primary" onclick="finishRound()">Finish & save round</button><button class="danger" onclick="cancelRound()">Discard</button></div></main>`}


// Older saved rounds have no pars: preserve their strokes but exclude them from par-based statistics.
function holePar(r,i){const v=r?.pars?.[i];return Number.isInteger(v)&&v>=2&&v<=10?v:null}
function holeClass(strokes,par){if(!Number.isInteger(strokes)||strokes<1||par===null)return null;if(strokes===1)return 'ace';let diff=strokes-par;if(diff<=-2)return 'eagle';if(diff===-1)return 'birdie';if(diff===0)return 'par';if(diff===1)return 'bogey';return 'double'}
function holeLabel(strokes,par){return {ace:'ACE!',eagle:'Eagle+',birdie:'Birdie',par:'Par',bogey:'Bogey',double:'Double+'}[holeClass(strokes,par)]||'—'}
function relativeScore(r,id){let delta=0,any=false;for(let i=0;i<r.holes;i++){let par=holePar(r,i),strokes=r.scores[id]?.[i];if(par!==null&&Number.isInteger(strokes)&&strokes>=1){delta+=strokes-par;any=true}}return any?(delta>0?'+':'')+delta:'—'}
function golfCareer(){let out=Object.fromEntries(activePlayers().map(p=>[p.id,{id:p.id,ace:0,eagle:0,birdie:0,par:0,bogey:0,double:0,scored:0}]));for(let r of data.rounds){for(let unit of eventUnits(r)){let members=teamMembers(r,unit);for(let i=0;i<r.holes;i++){let key=holeClass(r.scores[unit]?.[i],holePar(r,i));if(!key)continue;for(let pid of members)if(out[pid]){out[pid][key]++;out[pid].scored++}}}}return Object.values(out).sort((a,b)=>b.ace-a.ace||b.eagle-a.eagle||b.birdie-a.birdie||b.par-a.par||name(a.id).localeCompare(name(b.id)))}
function golfCareerTable(){let stats=golfCareer();if(!stats.length)return empty('Add a player to see career hole statistics');return `<div class="scroll"><table class="standings stat-table"><tr><th>#</th><th>Player</th><th>🥏 Ace</th><th>Eagle+</th><th>Birdie</th><th>Par</th><th>Bogey</th><th>Double+</th><th>Holes</th></tr>${stats.map((s,i)=>`<tr><td class="pos">${i+1}</td><td>${esc(name(s.id))}</td><td>${s.ace}</td><td>${s.eagle}</td><td>${s.birdie}</td><td>${s.par}</td><td>${s.bogey}</td><td>${s.double}</td><td>${s.scored}</td></tr>`).join('')}</table></div>`}

function startRound(){let n=+$('#participantCount').value,h=Number($('#holes').value);if(!Number.isInteger(h)||h<1||h>72)return alert('Enter a whole number of holes from 1 to 72.');if(!Number.isInteger(n)||n<2||n>32||selectedIds.length!==n)return alert(`Please select exactly ${n} players (2–32).`);if(roundMode==='doubles'&&(n<4||n%2))return alert('Doubles requires an even number of players (at least 4).');let teams=roundMode==='doubles'?teamsFromOrder(selectedIds):[];let units=roundMode==='doubles'?teams.map(t=>t.id):selectedIds;data.draftRound={id:uid(),date:$('#rDate').value||today(),holes:h,mode:roundMode,teams,ids:[...selectedIds],scores:Object.fromEntries(units.map(id=>[id,Array(h).fill(null)])),pars:Array(h).fill(3)};roundHole=0;save();render()}

function setHolePar(i,v){if(v!==''&&(!Number.isInteger(+v)||+v<2||+v>10))return alert('Par must be a whole number from 2 to 10.');let r=data.draftRound;if(!Array.isArray(r.pars))r.pars=Array(r.holes).fill(null);r.pars[i]=v===''?null:+v;save();render()}
function setStroke(id,i,v){if(v!==''&&(!Number.isInteger(+v)||+v<1||+v>30))return alert('Enter a whole number of strokes from 1 to 30.');data.draftRound.scores[id][i]=v===''?null:+v;save();render()}
function changeHole(n){roundHole=Math.min(Math.max(0,roundHole+n),data.draftRound.holes-1);render()}
function cancelRound(){if(confirm('Discard this unfinished round?')){data.draftRound=null;save();render()}}
function roundRanks(r){let arr=eventUnits(r).map(id=>({id,score:r.scores[id].reduce((a,b)=>a+Number(b||0),0)})).sort((a,b)=>a.score-b.score||labelUnit(r,a.id).localeCompare(labelUnit(r,b.id)));return arr.map(x=>({...x,rank:1+arr.filter(a=>a.score<x.score).length}))}

function finishRound(){const r=data.draftRound;let missing=eventUnits(r).some(id=>r.scores[id].some(v=>v===null||v===''));if(missing&&!confirm('Some holes are missing scores. Save this incomplete round anyway?'))return;let complete=!missing;data.rounds.unshift({...r,complete});data.draftRound=null;data.postRoundId=r.id;nextRoundHoles=r.holes;save();selectedIds=[...r.ids];go('round-done')}
function roundDonePage(){const r=data.rounds.find(r=>r.id===data.postRoundId)||data.rounds[0];if(!r)return head('Round complete')+`<main class="container"><button class="primary" onclick="go('home')">Return home</button></main>`;const ranks=roundRanks(r);return head('Round in the books!',`Disc golf · ${r.holes} holes · ${isDoubles(r)?'Doubles':'Singles'} · ${fmt(r.date)}`)+`<main class="container"><div class="card finish-banner"><div class="finish-disc">🥏</div><div class="eyebrow">${r.complete?'Saved round':'Saved incomplete round'}</div><h2>${ranks.length?esc(labelUnit(r,ranks[0].id))+' takes the top spot!':'Scores saved'}</h2><p class="muted small">Your scorecard is saved in the disc golf history. What's next?</p></div><div class="card"><h3>Final scorecard</h3><table class="standings"><tr><th>Place</th><th>${isDoubles(r)?'Team':'Player'}</th><th>Strokes</th><th>vs Par</th></tr>${ranks.map(x=>`<tr><td class="pos">${x.rank}</td><td>${esc(labelUnit(r,x.id))}</td><td>${x.score}</td><td>${relativeScore(r,x.id)}</td></tr>`).join('')}</table></div><div class="next-choices"><button class="primary wide" onclick="afterRound('putting')">🎯 Start putting tournament <span>Use this round's rankings and teams</span></button><button class="secondary wide" onclick="afterRound('round')">🥏 Play another disc golf round <span>Keep players and format, or change them</span></button><button class="ghost wide" onclick="afterRound('home')">⌂ Return to home</button></div></main>`}

function afterRound(action){const r=data.rounds.find(r=>r.id===data.postRoundId);if(r){selectedIds=isDoubles(r)?r.teams.flatMap(t=>t.members):[...r.ids];nextRoundHoles=r.holes;roundMode=isDoubles(r)?'doubles':'singles'}data.postRoundId=null;save();if(action==='putting'){puttingSource='round';puttingMode=isDoubles(r)?'doubles':'singles';go('putting')}else if(action==='round'){roundHole=0;go('round')}else go('home')}
function puttingPage(){let t=data.draftPutting;if(!t)return puttingSetup();let matches=t.matches;let totalDays=Math.max(...matches.map(m=>m.day),0)+1;puttingDay=Math.min(puttingDay,totalDays-1);let thisDay=matches.filter(m=>m.day===puttingDay);let standings=puttingStats(t);
return head('Putting tournament',`${t.ids.length} players · ${isDoubles(t)?'Doubles':'Singles'} · ${fmt(t.date)} · ${matches.filter(m=>m.aScore!==null&&m.bScore!==null).length}/${matches.length} matches entered`)+`<main class="container"><div class="card"><div class="row"><h3 style="margin:0">Round robin • Set ${puttingDay+1} of ${totalDays}</h3><span class="badge">${t.seedType==='round'?'Round seeded':t.seedType==='leaderboard'?'Leaderboard seeded':'Custom'}</span></div><div class="chips">${Array.from({length:totalDays},(_,i)=>`<button class="chip mini ${i===puttingDay?'on':''}" onclick="puttingDay=${i};render()">Set ${i+1}</button>`).join('')}</div>${thisDay.map(m=>`<div class="match"><div class="matchnames"><span>${esc(labelUnit(t,m.a))}</span><span class="muted">VS</span><span>${esc(labelUnit(t,m.b))}</span></div><div class="matchinputs"><input type="number" inputmode="numeric" min="0" max="999" placeholder="Points" value="${m.aScore??''}" aria-label="Score for ${esc(labelUnit(t,m.a))}" onchange="setMatch('${m.id}','a',this.value)"><b>—</b><input type="number" inputmode="numeric" min="0" max="999" placeholder="Points" value="${m.bScore??''}" aria-label="Score for ${esc(labelUnit(t,m.b))}" onchange="setMatch('${m.id}','b',this.value)"></div></div>`).join('')||empty('Bye for all players')}</div><div class="card"><h3>Live tournament standings</h3>${standTable(standings,t)}<p class="muted small">Ranked by wins, then point differential, then points scored. In doubles, the score and result count toward both teammates' career records.</p></div><div class="actions"><button class="primary" onclick="finishPutting()">Finish & save tournament</button><button class="danger" onclick="cancelPutting()">Discard</button></div></main>`}
function puttingSetup(){let sourceOptions=data.rounds.length?`<option value="round">Latest saved disc golf round</option>`:'';return head('Start putting','Singles or 2v2 round robin with shared results.')+`<main class="container"><div class="card">${modePicker('putting')}<label class="field">Seed player order from<select id="putSeed" onchange="setPuttingSeed(this.value)">${sourceOptions}<option value="leaderboard">All-time putting leaderboard</option><option value="custom">Choose players manually</option></select></label><p id="seedNote" class="note"></p><label class="field">Tournament date<input id="putDate" type="date" value="${today()}"></label><div id="puttingRoster"></div><div class="actions"><button class="primary wide" onclick="startPutting()">Generate round robin →</button></div></div><div class="card"><h3>How the round robin works</h3><p class="muted small">${puttingMode==='doubles'?'Each team of two plays every other team once. Team points scored and allowed count for both teammates.':'Every player competes against every other player once.'} A win earns 1 win, a loss 1 loss, and equal scores count as a draw. Tiebreakers use point differential, then points scored.</p></div></main>`}

function allTime(){let agg=Object.fromEntries(activePlayers().map(p=>[p.id,{id:p.id,w:0,l:0,d:0,pf:0,pa:0,g:0}]));for(let t of data.puttings)for(let m of t.matches){if(m.aScore===null||m.bScore===null)continue;for(let [unit,own,opp] of [[m.a,m.aScore,m.bScore],[m.b,m.bScore,m.aScore]])for(let id of teamMembers(t,unit)){if(!agg[id])continue;let x=agg[id];x.pf+=own;x.pa+=opp;x.g++;if(own>opp)x.w++;else if(own<opp)x.l++;else x.d++}}return sortStats(Object.values(agg))}
function seedIds(){let mode=$('#putSeed')?.value||puttingSource;if(mode==='round'){let r=data.rounds[0];return r?roundRanks(r).flatMap(x=>teamMembers(r,x.id)).filter(id=>!player(id)?.archived):[]}if(mode==='leaderboard')return allTime().map(x=>x.id);return selectedIds}
function setPuttingSeed(v){puttingSource=v;puttingTeamIds=null;teamSelected=null;refreshPuttingRoster()}
function refreshPuttingRoster(){
 let box=$('#puttingRoster'),note=$('#seedNote');if(!box)return;
 const mode=$('#putSeed').value,ids=seedIds();
 if(mode==='custom'){note.textContent='Choose players, then drag names between teams or tap two players to swap.';box.innerHTML=rosterSelector('putting');return}
 if(mode==='round'){
  const r=data.rounds[0];if(!r){note.textContent='Save a round first or choose another seed.';box.innerHTML='';return}
  note.textContent=`Seeded from ${fmt(r.date)} disc golf round. You can change the teams before playing.`;
 }else note.textContent='Seeded by putting leaderboard. You can change the teams before playing.';
 if(puttingMode==='doubles'){
  if(!puttingTeamIds||puttingTeamIds.length!==ids.length||puttingTeamIds.some(id=>!ids.includes(id))){
   if(mode==='round'&&isDoubles(data.rounds[0]))puttingTeamIds=[...ids];
   else puttingTeamIds=Array.from({length:Math.floor(ids.length/2)},(_,i)=>[ids[i],ids[ids.length-1-i]]).flat();
  }
  box.innerHTML=pairPreview(puttingTeamIds,mode);
 }else box.innerHTML=`<h3>Seed order</h3>${ids.map((id,i)=>`<div class="row"><span>${i+1}. ${esc(name(id))}</span></div>`).join('')||empty('Add players first')}`;
}

function makeMatches(ids){let list=[...ids];if(list.length%2)list.push(null);let n=list.length,days=n-1,arr=[];for(let day=0;day<days;day++){for(let i=0;i<n/2;i++){let a=list[i],b=list[n-1-i];if(a&&b)arr.push({id:uid(),day,a,b,aScore:null,bScore:null})}list=[list[0],list[n-1],...list.slice(1,n-1)]}return arr}
function startPutting(){let mode=$('#putSeed').value;let ids=seedIds();if(mode==='custom'){let n=+$('#participantCount').value;if(ids.length!==n)return alert(`Select exactly ${n} players.`)}ids=[...new Set(ids)];if(puttingMode==='doubles'&&(ids.length<4||ids.length%2))return alert('Doubles requires an even number of players, at least 4.');if(ids.length<2)return alert('Select at least 2 players.');let teams=[];if(puttingMode==='doubles'){teams=teamsFromOrder(mode==='custom'?selectedIds:puttingTeamIds||ids)}let units=puttingMode==='doubles'?teams.map(t=>t.id):ids;data.draftPutting={id:uid(),date:$('#putDate').value||today(),ids,mode:puttingMode,teams,seedType:mode,matches:makeMatches(units)};puttingDay=0;save();render()}

function setMatch(id,side,v){if(v!==''&&(!Number.isInteger(+v)||+v<0||+v>999))return alert('Enter a whole-number score from 0 to 999.');let m=data.draftPutting.matches.find(x=>x.id===id);m[side+'Score']=v===''?null:+v;save();render()}
function cancelPutting(){if(confirm('Discard this unfinished putting tournament?')){data.draftPutting=null;save();render()}}
function finishPutting(){let t=data.draftPutting;if(t.matches.some(m=>m.aScore===null||m.bScore===null)&&!confirm('Some matches have no final scores. Save anyway?'))return;data.puttings.unshift({...t,complete:t.matches.every(m=>m.aScore!==null&&m.bScore!==null)});data.draftPutting=null;save();alert('Tournament saved to historical leaderboards!');go('leaderboards')}
function sortStats(arr){return arr.sort((a,b)=>b.w-a.w||((b.pf-b.pa)-(a.pf-a.pa))||b.pf-a.pf||name(a.id).localeCompare(name(b.id)))}
function puttingStats(t){let stats=eventUnits(t).map(id=>({id,w:0,l:0,d:0,pf:0,pa:0,g:0}));for(let m of t.matches){if(m.aScore===null||m.bScore===null)continue;for(let [id,own,against] of [[m.a,m.aScore,m.bScore],[m.b,m.bScore,m.aScore]]){let x=stats.find(v=>v.id===id);if(!x)continue;x.g++;x.pf+=own;x.pa+=against;if(own>against)x.w++;else if(own<against)x.l++;else x.d++}}return stats.sort((a,b)=>b.w-a.w||((b.pf-b.pa)-(a.pf-a.pa))||b.pf-a.pf||labelUnit(t,a.id).localeCompare(labelUnit(t,b.id)))}
function standTable(arr,event=null){return `<div class="scroll"><table class="standings"><tr><th>#</th><th>${event&&isDoubles(event)?'Team':'Player'}</th><th>W</th><th>L</th><th>D</th><th>PF</th><th>PA</th><th>Diff</th></tr>${arr.map((x,i)=>`<tr><td class="pos">${i+1}</td><td>${esc(event?labelUnit(event,x.id):name(x.id))}</td><td>${x.w}</td><td>${x.l}</td><td>${x.d}</td><td>${x.pf}</td><td>${x.pa}</td><td>${x.pf-x.pa>0?'+':''}${x.pf-x.pa}</td></tr>`).join('')}</table></div>`}

function leaderboards(){return head('Leaderboards','Career records and past events, singles & doubles.')+`<main class="container"><div class="tabs"><button class="${lbTab==='putting'?'active':''}" onclick="lbTab='putting';render()">Putting standings</button><button class="${lbTab==='rounds'?'active':''}" onclick="lbTab='rounds';render()">Disc golf</button><button class="${lbTab==='history'?'active':''}" onclick="lbTab='history';render()">Putting history</button></div>${lbTab==='putting'?`<div class="card"><h3>All-time putting records</h3><p class="muted small">Doubles matches count toward each teammate's individual totals.</p>${activePlayers().length?standTable(allTime()):empty('No players yet')}${data.puttings.length===0?'<p class="muted small">Complete a putting tournament to record wins, losses, and points.</p>':''}</div>`:lbTab==='rounds'?`<div class="card"><h3>🥏 All-time disc golf hole stats</h3><p class="muted small">Aces, eagles or better, birdies, pars, bogeys and double bogeys or worse. Doubles team hole scores count for both teammates. Rounds saved before par tracking have no recorded pars and are excluded from these counts.</p>${golfCareerTable()}</div>`+data.rounds.map(r=>`<div class="card"><div class="row"><h3>${fmt(r.date)}</h3><span class="badge">${isDoubles(r)?'👥 Doubles · ':''}${r.holes} holes${r.complete?'':' · Incomplete'}</span></div><table class="standings"><tr><th>Place</th><th>${isDoubles(r)?'Team':'Player'}</th><th>Total strokes</th><th>vs Par</th></tr>${roundRanks(r).map(x=>`<tr><td class="pos">${x.rank}</td><td>${esc(labelUnit(r,x.id))}</td><td>${x.score}</td><td>${relativeScore(r,x.id)}</td></tr>`).join('')}</table><details style="margin-top:10px"><summary class="muted small">View hole-by-hole scores and pars</summary><div class="scroll"><table class="standings"><tr><th>Hole</th><th>Par</th>${eventUnits(r).map(id=>`<th>${esc(labelUnit(r,id))}</th>`).join('')}</tr>${Array.from({length:r.holes},(_,i)=>`<tr><td>${i+1}</td><td>${holePar(r,i)??'—'}</td>${eventUnits(r).map(id=>`<td>${r.scores[id]?.[i]??'—'} <span class="muted small">${holeLabel(r.scores[id]?.[i],holePar(r,i))}</span></td>`).join('')}</tr>`).join('')}</table></div></details><button class="linkbtn" onclick="useRoundSeed('${r.id}')">Start putting from this round →</button></div>`).join('')||empty('No saved disc golf rounds yet'):data.puttings.map(t=>`<div class="card"><div class="row"><h3>${fmt(t.date)}</h3><span class="badge">${isDoubles(t)?'👥 Doubles · ':''}${t.ids.length} players${t.complete?'':' · Incomplete'}</span></div>${standTable(puttingStats(t),t)}<details style="margin-top:12px"><summary class="muted small">View individual match results</summary>${t.matches.map(m=>`<p class="small">${esc(labelUnit(t,m.a))} ${m.aScore??'–'} — ${m.bScore??'–'} ${esc(labelUnit(t,m.b))}</p>`).join('')}</details></div>`).join('')||empty('No saved putting tournaments yet')}</main>`}

function useRoundSeed(id){let idx=data.rounds.findIndex(r=>r.id===id);if(idx>0){let [r]=data.rounds.splice(idx,1);data.rounds.unshift(r);save()}puttingSource='round';puttingMode=isDoubles(data.rounds[0])?'doubles':'singles';go('putting')}
function playersPage(){return head('Players','Manage who can join your rounds and tournaments.')+`<main class="container"><div class="card"><h3>Add player</h3><div class="inline"><label class="field" style="margin:0"><input id="singlePlayer" placeholder="Player name" onkeydown="if(event.key==='Enter')newSinglePlayer()"></label><button class="primary" style="flex:0 0 auto" onclick="newSinglePlayer()">Add</button></div></div><div class="card"><h3>Active players (${activePlayers().length})</h3><p class="muted small">Pick each player’s disc color for the doubles flip. Random is the default and picks a new color when flipping.</p>${activePlayers().map(p=>{const color=discColorPreference(p.id),sw=discSwatch(color);return `<div class="roster-player"><span class="disc-swatch" style="--swatch-light:${sw[0]};--swatch-dark:${sw[1]}"></span><div class="player-info"><b>${esc(p.name)}</b><div class="roster-info">${color==='random'?'Random disc color':DISC_COLORS[color]+' disc'}</div></div><div class="roster-controls"><label class="roster-info" for="discColor-${p.id}">Disc</label><select id="discColor-${p.id}" aria-label="Disc color for ${esc(p.name)}" onchange="savePlayerDiscColor('${p.id}',this.value)">${discColorOptions(color)}</select><div class="player-actions"><button class="ghost mini" onclick="renamePlayer('${p.id}')">Rename</button><button class="danger mini" onclick="removePlayer('${p.id}')" aria-label="Remove ${esc(p.name)}">Remove</button></div></div></div>`}).join('')||empty('No active players. Add one above.')}</div><div class="note">Removing a player takes them off the active roster and current leaderboard, but preserves past results. Add their name again to restore their records.</div><div class="card"><h3>Backup your data</h3><p class="muted small">This version stores your records on this device in this browser only. Export a backup before clearing your browsing data or changing phones.</p><div class="actions"><button class="secondary" onclick="exportData()">Export backup</button><button class="secondary" onclick="$('#importFile').click()">Import backup</button><input id="importFile" type="file" accept=".json,application/json" hidden onchange="importData(this)"></div></div></main>`}
function newSinglePlayer(){let n=$('#singlePlayer').value,id=addPlayer(n);if(!id)return alert('Enter a player name.');render()}
function renamePlayer(id){let p=player(id),n=prompt('New player name',p.name);if(!n?.trim())return;if(data.players.some(x=>x.id!==id&&x.name.toLowerCase()===n.trim().toLowerCase()))return alert('That name already exists.');p.name=n.trim();save();render()}
function removePlayer(id){
 const p=player(id);if(!p)return;
 const inDraft=[data.draftRound,data.draftPutting].some(e=>e?.ids?.includes(id));
 if(inDraft)return alert(`${p.name} is in a round or putting tournament in progress. Finish or discard it before removing this player.`);
 if(!confirm(`Remove ${p.name} from active players?\n\nTheir historical disc golf and putting results will be preserved. You can restore the player later by adding the same name.`))return;
 p.archived=true;
 if(starterPlayers.some(n=>n.toLowerCase()===p.name.toLowerCase())&&!data.removedDefaultNames.some(n=>n.toLowerCase()===p.name.toLowerCase()))data.removedDefaultNames.push(p.name);
 selectedIds=selectedIds.filter(x=>x!==id);
 save();render();
}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='chain-gang-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function importData(el){let file=el.files?.[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.players)||!Array.isArray(obj.rounds)||!Array.isArray(obj.puttings))throw Error('Invalid disc golf backup');if(!confirm('Import backup and replace existing data on this device?'))return;data={players:obj.players,rounds:obj.rounds,puttings:obj.puttings,draftRound:obj.draftRound||null,draftPutting:obj.draftPutting||null,removedDefaultNames:obj.removedDefaultNames||[]};save();render()}catch(e){alert('Could not import: '+e.message)}}
window.addEventListener('beforeunload',save);render();if(page==='putting'&&!data.draftPutting)refreshPuttingRoster();
const originalRender=render;render=function(){originalRender();if(page==='putting'&&!data.draftPutting){let el=$('#putSeed');if(el){if(puttingSource==='round'&&!data.rounds.length)puttingSource='leaderboard';el.value=puttingSource;refreshPuttingRoster()}}};render();
</script></body></html>
